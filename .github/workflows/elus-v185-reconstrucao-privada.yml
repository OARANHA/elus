name: ELUS v1.85 - reconstrução privada isolada

# Manual e protegido: exige secrets de uma conta PostgreSQL SOMENTE LEITURA
# e acesso à tabela supabase_migrations.schema_migrations do ELUS.
# Reproduz os sete lotes privados e tenta aplicar as quatro migrations ELUS;
# ainda NÃO constitui upgrade v1.89 nem replica o ledger histórico.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconstruir-v185:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: elus-upgrade-readonly
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/preparar-node
        timeout-minutes: 5
      - name: Exportar e verificar os sete lotes apenas no runner
        shell: bash
        env:
          PGHOST: ${{ secrets.ELUS_UPGRADE_PGHOST }}
          PGPORT: ${{ secrets.ELUS_UPGRADE_PGPORT }}
          PGUSER: ${{ secrets.ELUS_UPGRADE_PGUSER }}
          PGPASSWORD: ${{ secrets.ELUS_UPGRADE_PGPASSWORD }}
          PGDATABASE: ${{ secrets.ELUS_UPGRADE_PGDATABASE }}
          PGSSLMODE: verify-full
          ELUS_UPGRADE_PG_CA_CERT: ${{ secrets.ELUS_UPGRADE_PG_CA_CERT }}
        run: |
          set -euo pipefail
          [ -n "$PGHOST" ] && [ -n "$PGPORT" ] && [ -n "$PGUSER" ] &&
          [ -n "$PGPASSWORD" ] && [ -n "$PGDATABASE" ] || {
            echo "::error::Conexão privada read-only indisponível; nenhum SQL exportado"
            exit 1
          }
          # Falhar fechado se os secrets apontarem acidentalmente à conta administrativa.
          [ "$PGUSER" = "elus_upgrade_readonly.tbwcgdmenrcnghogqkqi" ] || {
            echo "::error::Usuário de exportação não corresponde à conta de leitura dedicada"
            exit 1
          }
          [ -n "${ELUS_UPGRADE_PG_CA_CERT:-}" ] || {
            echo "::error::Certificado CA privado não configurado"
            exit 1
          }
          umask 077
          private_dir="$(mktemp -d /tmp/elus-v185-private.XXXXXXXX)"
          echo "ELUS_PRIVATE_DIR=$private_dir" >> "$GITHUB_ENV"
          # Diagnóstico estritamente classificado: jamais imprimir URL, host, senha ou SQL.
          node --input-type=module <<'NODE'
          import { Client } from "pg";
          const client = new Client({
            connectionTimeoutMillis: 8000,
            query_timeout: 10000,
            application_name: "elus-v185-private-readonly-preflight",
            ssl: { ca: process.env.ELUS_UPGRADE_PG_CA_CERT, rejectUnauthorized: true },
          });
          const categories = {
            ENETUNREACH: "NETWORK_UNREACHABLE",
            EHOSTUNREACH: "NETWORK_UNREACHABLE",
            ETIMEDOUT: "NETWORK_TIMEOUT",
            ECONNREFUSED: "NETWORK_REFUSED",
            ENOTFOUND: "DNS_UNAVAILABLE",
            EAI_AGAIN: "DNS_UNAVAILABLE",
            "28P01": "AUTH_FAILED",
            "28000": "AUTH_FAILED",
            "42501": "READ_PERMISSION_DENIED",
            ERR_TLS_CERT_ALTNAME_INVALID: "TLS_HOSTNAME_MISMATCH",
            SELF_SIGNED_CERT_IN_CHAIN: "TLS_UNTRUSTED_CHAIN",
            UNABLE_TO_VERIFY_LEAF_SIGNATURE: "TLS_UNTRUSTED_CHAIN",
          };
          try {
            await client.connect();
            await client.query("BEGIN READ ONLY");
            await client.query("SELECT version FROM supabase_migrations.schema_migrations LIMIT 1");
            await client.query("ROLLBACK");
            console.log("PREFLIGHT_READONLY=PASS");
          } catch (error) {
            const code = typeof error?.code === "string" ? error.code : "";
            const category = categories[code] ?? "CONNECTION_OR_QUERY_FAILED";
            console.error("::error::PREFLIGHT_READONLY=" + category + " (sem detalhes confidenciais)");
            process.exitCode = 1;
          } finally {
            await client.end().catch(() => {});
          }
          NODE
          node scripts/exportar-lotes-v185-privado.mjs "$private_dir/lotes"
          node scripts/verificar-lotes-v185.mjs "$private_dir/lotes"
      - name: Reconstruir somente baseline v1.85 em PostgreSQL efêmero
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --rm --name "elus-v185-${GITHUB_RUN_ID}" \
            --env POSTGRES_PASSWORD=ephemeral-only \
            --env POSTGRES_DB=elus_isolado \
            pgvector/pgvector:pg17 >/dev/null
          for attempt in $(seq 1 45); do
            if docker exec "elus-v185-${GITHUB_RUN_ID}" pg_isready -U postgres -d elus_isolado >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec "elus-v185-${GITHUB_RUN_ID}" pg_isready -U postgres -d elus_isolado >/dev/null
          # Reutilizar o bootstrap Supabase que já sustenta scripts/test-db.sh.
          # Nunca adaptar nem editar os sete lotes SQL históricos.
          bootstrap_file="$ELUS_PRIVATE_DIR/pg-bootstrap.sql"
          awk '
            /^# Criamos os stubs mínimos AQUI/ { anchor=1; next }
            anchor && /^psql_install <<.SQL.$/ { inside=1; next }
            inside && /^SQL$/ { end=1; exit }
            inside { print }
            END { if (!inside || !end) exit 1 }
          ' scripts/test-db.sh > "$bootstrap_file"
          if ! docker exec -i "elus-v185-${GITHUB_RUN_ID}" psql -X -q \
            -v ON_ERROR_STOP=1 -U postgres -d elus_isolado < "$bootstrap_file" >/dev/null 2>&1; then
            echo "::error::Bootstrap do Supabase no banco temporário falhou (detalhes omitidos)"
            exit 1
          fi
          rm -f -- "$bootstrap_file"
          for version in 20261018200431 20261018204508 20261018204837 20261018204851 20261018204924 20261018204939 20261018204955; do
            # O SQL original e stderr ficam privados. VERBOSITY=sqlstate só
            # emite o código PostgreSQL (sem mensagens, objetos ou queries).
            error_file="$ELUS_PRIVATE_DIR/pg-error-private"
            if ! docker exec -i "elus-v185-${GITHUB_RUN_ID}" psql -X -q \
              -v ON_ERROR_STOP=1 -v VERBOSITY=sqlstate -U postgres -d elus_isolado \
              < "$ELUS_PRIVATE_DIR/lotes/$version.sql" >/dev/null 2>"$error_file"; then
              sqlstate="UNKNOWN"
              while IFS= read -r line; do
                if [[ "$line" =~ ERROR:[[:space:]]*([0-9A-Z]{5}) ]]; then
                  sqlstate="${BASH_REMATCH[1]}"
                  break
                fi
              done < "$error_file"
              echo "::error::Reprodução v1.85 bloqueada no lote $version; SQLSTATE=$sqlstate (SQL omitido)"
              exit 1
            fi
            rm -f -- "$error_file"
          done
          echo "Reprodução isolada dos sete lotes v1.85: PASS" >> "$GITHUB_STEP_SUMMARY"
          # Segundo estágio: migrations próprias ELUS na ordem do ledger real.
          # Não altera o Supabase real; só o container descartável deste job.
          for migration in \
            supabase/migrations/20261019120000_0689_integracoes_erp_vendaerp.sql \
            supabase/migrations/20261020120000_0690_org_ai_autonomy_protected.sql \
            supabase/migrations/20261020120001_0691_chutes_chat_catalog.sql \
            supabase/migrations/20261020230000_0692_chutes_catalog_sync.sql; do
            error_file="$ELUS_PRIVATE_DIR/pg-error-private"
            if ! docker exec -i "elus-v185-${GITHUB_RUN_ID}" psql -X -q \
              -v ON_ERROR_STOP=1 -v VERBOSITY=sqlstate -U postgres -d elus_isolado \
              < "$migration" >/dev/null 2>"$error_file"; then
              sqlstate="UNKNOWN"
              while IFS= read -r line; do
                if [[ "$line" =~ ERROR:[[:space:]]*([0-9A-Z]{5}) ]]; then
                  sqlstate="${BASH_REMATCH[1]}"
                  break
                fi
              done < "$error_file"
              echo "::error::Migration ELUS falhou: $(basename "$migration"); SQLSTATE=$sqlstate (SQL omitido)"
              exit 1
            fi
            rm -f -- "$error_file"
          done
          echo "Quatro migrations próprias ELUS aplicadas ao clone: PASS" >> "$GITHUB_STEP_SUMMARY"
          # Espelho de METADADOS do ledger no clone, não substitui o
          # dump integral da tabela supabase_migrations.schema_migrations.
          # Somente após todas as 11 aplicações SQL terminarem sem erros.
          if ! docker exec -i "elus-v185-${GITHUB_RUN_ID}" psql -X -q \
            -v ON_ERROR_STOP=1 -U postgres -d elus_isolado >/dev/null 2>&1 <<'LEDGER_SQL'
          BEGIN;
          CREATE SCHEMA IF NOT EXISTS supabase_migrations;
          CREATE TABLE IF NOT EXISTS supabase_migrations.schema_migrations (
            version text PRIMARY KEY,
            name text NOT NULL
          );
          INSERT INTO supabase_migrations.schema_migrations(version, name) VALUES
            ('20261018200431','elus_v185_preparar_extensoes_92d37f6'),
            ('20261018204508','elus_v185_baseline_92d37f6_p01_of_06'),
            ('20261018204837','elus_v185_baseline_92d37f6_p02_of_06'),
            ('20261018204851','elus_v185_baseline_92d37f6_p03_of_06'),
            ('20261018204924','elus_v185_baseline_92d37f6_p04_of_06'),
            ('20261018204939','elus_v185_baseline_92d37f6_p05_of_06'),
            ('20261018204955','elus_v185_baseline_92d37f6_p06_of_06'),
            ('20261019204449','integracoes_erp_vendaerp_0689'),
            ('20261021025530','elus_0690_org_ai_autonomy_protected'),
            ('20261021025551','elus_0691_chutes_chat_catalog'),
            ('20261021025613','elus_0692_chutes_catalog_sync');
          DO $
          BEGIN
            IF (SELECT count(*) FROM supabase_migrations.schema_migrations) <> 11 THEN
              RAISE EXCEPTION 'Ledger espelhado não tem 11 entradas';
            END IF;
          END $;
          COMMIT;
          LEDGER_SQL
          then
            echo "::error::Espelho isolado dos metadados de 11 versões falhou (SQL omitido)"
            exit 1
          fi
          echo "Espelho de metadados do ledger com 11 versões no clone: PASS (não é paridade integral)." >> "$GITHUB_STEP_SUMMARY"
          echo "NÃO PROVADO: paridade integral de ledger (incluindo statements), 38 migrations upstream v1.89, rollback e paridade de Supabase." >> "$GITHUB_STEP_SUMMARY"
      - name: Destruir os artefatos privados e o banco temporário
        if: always()
        shell: bash
        run: |
          if [ -n "${ELUS_PRIVATE_DIR:-}" ]; then
            rm -rf -- "$ELUS_PRIVATE_DIR"
          fi
          docker rm -f "elus-v185-${GITHUB_RUN_ID}" >/dev/null 2>&1 || true
