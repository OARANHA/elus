name: ELUS v1.85 - reconstrução privada isolada

# Manual e protegido: exige secrets de uma conta PostgreSQL SOMENTE LEITURA
# e acesso à tabela supabase_migrations.schema_migrations do ELUS.
# Não reproduz automaticamente as quatro migrations ELUS nem o upgrade v1.89.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconstruir-v185:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: elus-upgrade-readonly
    env:
      NODE_ENV: test
    steps:
      # Falhar antes de checkout, acesso a secrets ou SQL se o dispatch não
      # selecionar explicitamente a branch de migrations autorizada.
      - name: Bloquear execução fora da branch autorizada
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ] ||
             [ "${GITHUB_REF}" != "refs/heads/feat/elus-v189-migrations-20261025" ]; then
            echo "::error::Reconstrução privada bloqueada: selecione a branch de migrations autorizada."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/preparar-node
        timeout-minutes: 5
      - name: Exportar e verificar os sete lotes apenas no runner
        shell: bash
        env:
          PGHOST: ${{ secrets.ELUS_UPGRADE_PGHOST }}
          PGPORT: ${{ secrets.ELUS_UPGRADE_PGPORT }}
          PGUSER: ${{ secrets.ELUS_UPGRADE_PGUSER }}
          PGPASSWORD: ${{ secrets.ELUS_UPGRADE_PGPASSWORD }}
          PGDATABASE: ${{ secrets.ELUS_UPGRADE_PGDATABASE }}
          PGSSLMODE: verify-full
        run: |
          set -euo pipefail
          [ -n "$PGHOST" ] && [ -n "$PGPORT" ] && [ -n "$PGUSER" ] &&
          [ -n "$PGPASSWORD" ] && [ -n "$PGDATABASE" ] || {
            echo "::error::Conexão privada read-only indisponível; nenhum SQL exportado"
            exit 1
          }
          # Falhar fechado se os secrets apontarem acidentalmente à conta administrativa.
          [ "$PGUSER" = "elus_upgrade_readonly" ] || {
            echo "::error::Usuário de exportação não corresponde à conta de leitura dedicada"
            exit 1
          }
          umask 077
          private_dir="$(mktemp -d /tmp/elus-v185-private.XXXXXXXX)"
          echo "ELUS_PRIVATE_DIR=$private_dir" >> "$GITHUB_ENV"
          node scripts/exportar-lotes-v185-privado.mjs "$private_dir/lotes"
          node scripts/verificar-lotes-v185.mjs "$private_dir/lotes"
      - name: Reconstruir somente baseline v1.85 em PostgreSQL efêmero (PG15 e PG17)
        shell: bash
        run: |
          set -euo pipefail
          # Exportação privada ocorre uma vez; ambos os bancos são descartáveis.
          # Não imprimir SQL, hashes, identificadores, host nem credenciais.
          for pg in 15 17; do
            container="elus-v185-${GITHUB_RUN_ID}-pg${pg}"
            docker run --detach --rm --name "$container" \
              --env POSTGRES_PASSWORD=ephemeral-only \
              --env POSTGRES_DB=elus_isolado \
              "pgvector/pgvector:pg${pg}" >/dev/null
            for attempt in $(seq 1 45); do
              if docker exec "$container" pg_isready -U postgres -d elus_isolado >/dev/null 2>&1; then break; fi
              sleep 1
            done
            docker exec "$container" pg_isready -U postgres -d elus_isolado >/dev/null
            for version in 20261018200431 20261018204508 20261018204837 20261018204851 20261018204924 20261018204939 20261018204955; do
              if ! docker exec -i "$container" psql -X -q -v ON_ERROR_STOP=1 -U postgres -d elus_isolado \
                < "$ELUS_PRIVATE_DIR/lotes/$version.sql" >/dev/null 2>&1; then
                echo "::error::Reprodução v1.85 bloqueada no PostgreSQL $pg, lote $version (SQL omitido)"
                exit 1
              fi
            done
            echo "Reprodução isolada dos sete lotes v1.85 em PostgreSQL $pg: PASS" >> "$GITHUB_STEP_SUMMARY"
            docker rm -f "$container" >/dev/null 2>&1 || true
          done
          echo "NÃO PROVADO: quatro migrations ELUS, upgrade v1.89, rollback e paridade de Supabase." >> "$GITHUB_STEP_SUMMARY"
      - name: Destruir os artefatos privados e o banco temporário
        if: always()
        shell: bash
        run: |
          if [ -n "${ELUS_PRIVATE_DIR:-}" ]; then
            rm -rf -- "$ELUS_PRIVATE_DIR"
          fi
          for pg in 15 17; do
            docker rm -f "elus-v185-${GITHUB_RUN_ID}-pg${pg}" >/dev/null 2>&1 || true
          done
