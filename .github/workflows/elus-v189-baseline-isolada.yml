name: ELUS v1.89 - ensaio isolado de baseline

# Ensaio em PR de schema ou disparo manual; sem Supabase de produção, segredos ou E2E.
# ATENÇÃO: comprova instalação/idempotência da baseline candidata,
# NÃO comprova upgrade real do ledger v1.85 (sete SQLs privados ausentes).
on:
  pull_request:
    paths:
      - 'supabase/baseline.sql'
      - 'supabase/migrations/**'
      - 'scripts/test-db.sh'
      - 'scripts/exportar-lotes-v185-privado.mjs'
      - 'tests/unit/elus-v185-exportacao-privada.test.ts'
      - '.github/workflows/elus-v189-baseline-isolada.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-efemera:
    name: Baseline candidata PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pg: ["15", "17"]
    env:
      TEST_DB_IMAGE: pgvector/pgvector:pg${{ matrix.pg }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/preparar-node
        timeout-minutes: 5
      # O fork ELUS ainda não publicou as tags upstream. Buscar só as tags
      # oficiais no checkout efêmero e conferir seus commits, sem push.
      - name: Pinagem das releases oficiais do teste de isolamento
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 --no-tags https://github.com/melgarafael/DeskcommCRM.git \
            '+refs/tags/v1.89.0:refs/tags/v1.89.0' \
            '+refs/tags/v1.63.0:refs/tags/v1.63.0'
          test "$(git rev-parse 'refs/tags/v1.89.0^{commit}')" = '6540929d5ef7a951531dda550db0bf54affa516a'
          test "$(git rev-parse 'refs/tags/v1.63.0^{commit}')" = '0fd9bda24fac7430dbb240e87c35cc9fd7ce7633'
      - name: Verificar contratos estáticos da exportação
        run: pnpm exec vitest run tests/unit/elus-v185-exportacao-privada.test.ts
      - name: Instalação e atualização idempotente em PostgreSQL efêmero
        env:
          # A release publicada pertence ao upstream, não ao fork ELUS.
          # Não consultar a API anônima no runner (rate limit) nem aceitar
          # um tag móvel: os SHAs foram verificados no passo anterior.
          CONFERENCIA_KIT_RELEASE: v1.89.0
        run: pnpm test:db
      - name: Resultado e limite da prova
        if: success()
        run: |
          echo "PASS: baseline candidata PostgreSQL ${{ matrix.pg }} (instalação + reaplicação + invariantes)." >> "$GITHUB_STEP_SUMMARY"
          echo "NÃO TESTADO: replay fiel dos 7 blocos SQL privados v1.85 nem upgrade do ledger real." >> "$GITHUB_STEP_SUMMARY"
