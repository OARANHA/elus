name: Bootstrap DeskcommCRM v1.85.0

# Executa apenas no commit de inclusão/ajuste deste bootstrap.
# Nunca implanta serviços, não acessa o Supabase e não modifica a main.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bootstrap-deskcomm-v185.yml']

permissions:
  contents: write

jobs:
  importar-upstream-fixado:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout do repositório ELUS
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Importar snapshot oficial para branch própria
        shell: bash
        env:
          UPSTREAM_SHA: 83aeac8f78aa076f3adfaf3e773c8616229e5cd9
        run: |
          set -euo pipefail
          origem="$RUNNER_TEMP/deskcommcrm-v185"
          git clone --depth 1 --branch v1.85.0 --single-branch \
            https://github.com/melgarafael/DeskcommCRM.git "$origem"
          obtido="$(git -C "$origem" rev-parse HEAD)"
          test "$obtido" = "$UPSTREAM_SHA" || {
            echo "::error::A release oficial não corresponde ao commit fixado."
            exit 1
          }

          git switch -c bootstrap/deskcommcrm-v1.85.0

          # O GitHub App não tem autorização para criar/alterar workflows.
          # Preservar TODOS os workflows locais; importar os oficiais separadamente,
          # mediante a permissão específica, nunca forçar push de arquivos protegidos.
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/.github/workflows/' \
            "$origem/" ./

          test -f supabase/baseline.sql || {
            echo "::error::Baseline oficial ausente."
            exit 1
          }
          test -f hostgator-setup-kit/install.sh || {
            echo "::error::Instalador oficial ausente."
            exit 1
          }
          git diff --check
          git add -A
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo "::error::Importação tentou alterar workflow protegido."
            exit 1
          fi
          test -n "$(git status --porcelain)" || {
            echo "::error::Nenhuma mudança importada."
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: importa snapshot da DeskcommCRM v1.85.0 ($UPSTREAM_SHA)"
          git push origin HEAD:refs/heads/bootstrap/deskcommcrm-v1.85.0

          {
            printf '%s\n' '### Importação preparada'
            printf '%s\n' "- Snapshot upstream: $UPSTREAM_SHA"
            printf '%s\n' '- Branch: bootstrap/deskcommcrm-v1.85.0'
            printf '%s\n' '- Workflows oficiais excluídos (permissão específica pendente).'
            printf '%s\n' '- Nenhum deploy ou banco alterado.'
            printf '%s\n' '- Abrir PR para main e validar antes de merge.'
          } >> "$GITHUB_STEP_SUMMARY"
