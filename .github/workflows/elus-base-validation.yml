name: ELUS — validação inicial da base 1.85.0

on:
  pull_request:
    branches: [main]
  push:
    branches: [bootstrap/deskcommcrm-v1.85.0]

permissions:
  contents: read

concurrency:
  group: elus-base-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout do commit de validação
        uses: actions/checkout@v4
      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Habilitar pnpm 9.15.9
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - name: Verificar arquivos oficiais de instalação
        shell: bash
        run: |
          set -euo pipefail
          test -s supabase/baseline.sql
          test -s hostgator-setup-kit/install.sh
          test -s pnpm-lock.yaml
          test -s CLAUDE.md
          test -s AGENTS.md
          test -s docs/index.md
          if test -e .env; then
            echo "::error::Não incluir .env no repositório"
            exit 1
          fi
      - name: Instalar dependências fixadas
        run: pnpm install --frozen-lockfile
      - name: Verificar TypeScript
        run: pnpm typecheck
      - name: Testar contratos básicos da release
        run: pnpm exec vitest run tests/unit/agents-md-versoes.test.ts tests/unit/documentacao-aponta-para-o-que-existe.test.ts
